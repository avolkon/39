[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chemai-predict-cure"
version = "0.1.0"
description = "ChemAI: Predict the Cure — ML pipeline for IC50/CC50/SI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "lightgbm>=4.3",
    "xgboost>=2.0",
    "python-dotenv>=1.0",
    "pydantic-settings>=2.2",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4", "matplotlib>=3.8"]
nn = ["torch>=2.1"]
optuna = ["optuna>=3.5"]
catboost = ["catboost>=1.2"]

[tool.setuptools.packages.find]
where = ["ml/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["ml/src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["ml/src", "tests", "run_pipeline.py", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"run_pipeline.py" = ["E501"]
"tools/eda_generate_report.py" = ["E501", "B905"]
